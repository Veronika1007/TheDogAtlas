<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Community – TheDogAtlas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <style>
      .friends-grid-container {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
      }
      .forum-topic-link {
        text-decoration: none;
        color: inherit;
        display: block;
        margin-bottom: 16px;
        transition: transform 0.2s;
      }
      .forum-topic-link:hover .forum-topic-card {
        border-color: var(--primary);
        background-color: #fffaf8;
        transform: translateY(-2px);
      }
      @media (max-width: 900px) {
        .friends-grid-container {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <a href="index.html"
          ><img src="Media/Logo2.jpg" alt="Logo" style="height: 55px"
        /></a>
      </div>
      <nav>
        <a href="index.html" class="nav-link">Map</a>
        <a href="planner.html" class="nav-link">Planner</a>
        <a href="trails.html" class="nav-link">Trails</a>
        <a href="events.html" class="nav-link">Events</a>
        <a href="community.html" class="nav-link active">Community</a>
        <a href="profile.html" id="profile-link" class="nav-link hidden"
          >My Profile</a
        >
        <a href="login.html" id="login-link" class="nav-link">Login</a>
        <a
          href="#"
          id="logout-link"
          onclick="logoutUser()"
          class="nav-link hidden"
          >Log Out</a
        >
      </nav>
    </header>

    <main class="community-container">
      <div class="search-container">
        <div class="search-input-wrapper">
          <i class="fa fa-search"></i>
          <input
            type="text"
            id="global-search"
            placeholder="Search for dogs, breeds, or topics..."
          />
        </div>
      </div>

      <div class="community-tabs-wrapper">
        <div class="community-tabs">
          <button
            id="tab-posts-btn"
            class="tab-btn active"
            onclick="showSection('posts')"
          >
            Feed
          </button>
          <button
            id="tab-friends-btn"
            class="tab-btn"
            onclick="showSection('friends')"
          >
            Friends
          </button>
          <button
            id="tab-forum-btn"
            class="tab-btn"
            onclick="showSection('forum')"
          >
            Forum
          </button>
        </div>
      </div>

      <div id="section-posts" class="community-section post-grid"></div>

      <div id="section-friends" class="community-section hidden">
        <div
          style="
            background: white;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 25px;
          "
        >
          <h4 style="margin: 0 0 15px 0; color: var(--primary)">
            Discover the Pack
          </h4>
          <div
            class="filter-group"
            style="padding: 20px; display: flex; gap: 15px; flex-wrap: wrap"
          >
            <select
              id="filter-breed"
              style="padding: 10px; border-radius: 8px; flex: 1"
            >
              <option value="">All Breeds</option>
              <option value="Springer Spaniel">Springer Spaniel</option>
              <option value="Retriever">Retriever</option>
              <option value="German Shepherd">German Shepherd</option>
            </select>

            <select
              id="filter-distance"
              style="padding: 10px; border-radius: 8px; flex: 1"
            >
              <option value="">Any Distance</option>
              <option value="5">Within 5 miles</option>
              <option value="10">Within 10 miles</option>
              <option value="25">Within 25 miles</option>
            </select>

            <input
              type="text"
              id="member-search"
              placeholder="Search dog name..."
              style="
                padding: 10px;
                border-radius: 8px;
                flex: 2;
                border: 1px solid #ddd;
              "
            />

            <button
              id="friends-search-btn"
              class="follow-btn-small"
              style="height: 40px"
            >
              Search
            </button>
          </div>
        </div>
        <h3 style="margin-bottom: 15px">
          <i class="fa fa-heart" style="color: #ff4d4d"></i> My Pack
        </h3>
        <div
          id="following-grid"
          class="friends-grid-container"
          style="margin-bottom: 30px"
        ></div>
        <hr />
        <h3 style="margin-bottom: 15px">
          <i class="fa fa-plus-circle" style="color: var(--teal)"></i> New
          Friends
        </h3>
        <div id="friends-grid" class="friends-grid-container"></div>
      </div>

      <div id="section-forum" class="community-section hidden">
        <button
          id="open-post-form"
          class="follow-btn-small"
          style="margin-bottom: 20px"
        >
          + New Topic
        </button>
        <div
          id="new-post-modal"
          class="hidden"
          style="
            background: #fff;
            padding: 20px;
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 25px;
          "
        >
          <form id="create-post-form">
            <input
              type="text"
              id="post-title"
              placeholder="Topic Title"
              required
              style="width: 100%; padding: 10px; margin-bottom: 10px"
            />
            <select
              id="post-category"
              style="width: 100%; padding: 10px; margin-bottom: 10px"
            >
              <option value="General">General</option>
              <option value="Walks">Walks</option>
            </select>
            <textarea
              id="post-description"
              placeholder="What's on your mind?"
              required
              style="
                width: 100%;
                padding: 10px;
                height: 100px;
                margin-bottom: 10px;
              "
            ></textarea>
            <button type="submit" class="save-btn">Post to Forum</button>
            <button
              type="button"
              id="cancel-post"
              style="
                background: none;
                border: none;
                width: 100%;
                margin-top: 10px;
                cursor: pointer;
              "
            >
              Cancel
            </button>
          </form>
        </div>
        <div id="dynamic-forum-list"></div>
      </div>
    </main>

    <script>
      function showSection(section) {
        document
          .querySelectorAll(".community-section")
          .forEach((s) => s.classList.add("hidden"));
        document
          .querySelectorAll(".tab-btn")
          .forEach((b) => b.classList.remove("active"));
        document
          .getElementById("section-" + section)
          .classList.remove("hidden");
        document
          .getElementById("tab-" + section + "-btn")
          .classList.add("active");
      }

      // New script block for UI handling
      document.addEventListener("DOMContentLoaded", () => {
        const openPostBtn = document.getElementById("open-post-form");
        const postModal = document.getElementById("new-post-modal");
        const cancelPostBtn = document.getElementById("cancel-post");

        if (openPostBtn) {
          openPostBtn.onclick = () => postModal.classList.remove("hidden");
        }
        if (cancelPostBtn) {
          cancelPostBtn.onclick = () => postModal.classList.add("hidden");
        }

        // Handle URL hash to open correct tab (e.g., coming back from detail page)
        if (window.location.hash === "#section-forum") {
          showSection("forum");
        }
      });
    </script>
    <script type="module" src="firebase-config.js"></script>
  </body>
</html>
