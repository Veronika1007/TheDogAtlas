<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Community – TheDogAtlas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <style>
      .friends-grid-container {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
      }
      .forum-topic-link {
        text-decoration: none;
        color: inherit;
        display: block;
        margin-bottom: 16px;
        transition: transform 0.2s;
      }
      .forum-topic-link:hover .forum-topic-card {
        border-color: var(--primary);
        background-color: #fffaf8;
        transform: translateY(-2px);
      }
      @media (max-width: 900px) {
        .friends-grid-container {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <a href="index.html"
          ><img src="Media/Logo2.jpg" alt="Logo" style="height: 55px"
        /></a>
      </div>
      <nav>
        <a href="index.html" class="nav-link">Map</a>
        <a href="planner.html" class="nav-link">Planner</a>
        <a href="trails.html" class="nav-link">Trails</a>
        <a href="events.html" class="nav-link">Events</a>
        <a href="community.html" class="nav-link active">Community</a>
        <a href="profile.html" id="profile-link" class="nav-link hidden"
          >My Profile</a
        >
        <a href="login.html" id="login-link" class="nav-link">Login</a>
        <a
          href="#"
          id="logout-link"
          onclick="logoutUser()"
          class="nav-link hidden"
          >Log Out</a
        >
      </nav>
    </header>

    <main class="community-container">
      <div class="community-tabs-wrapper">
        <div class="community-tabs">
          <button
            id="tab-posts-btn"
            class="tab-btn active"
            onclick="showSection('posts')"
          >
            Feed
          </button>
          <button
            id="tab-friends-btn"
            class="tab-btn"
            onclick="showSection('friends')"
          >
            Friends
          </button>
          <button
            id="tab-forum-btn"
            class="tab-btn"
            onclick="showSection('forum')"
          >
            Forum
          </button>
        </div>
      </div>

      <div id="section-posts" class="community-section">
        <div
          class="create-post-trigger"
          onclick="document.getElementById('feed-post-modal').classList.remove('hidden')"
          style="
            background: white;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            border: 1px solid var(--border);
          "
        >
          <div
            style="
              width: 40px;
              height: 40px;
              border-radius: 50%;
              background: #eee;
              overflow: hidden;
            "
          >
            <img
              id="feed-avatar-small"
              src="https://via.placeholder.com/40"
              style="width: 100%; height: 100%; object-fit: cover"
            />
          </div>
          <span style="color: #666">Share a photo of your dog...</span>
          <i
            class="fa fa-camera"
            style="margin-left: auto; color: var(--primary); font-size: 20px"
          ></i>
        </div>

        <div id="instagram-feed" class="feed-grid"></div>
      </div>

      <div
        id="feed-post-modal"
        class="hidden"
        style="
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background: rgba(0, 0, 0, 0.8);
          z-index: 3000;
          display: flex;
          align-items: center;
          justify-content: center;
        "
      >
        <div
          style="
            background: white;
            width: 90%;
            max-width: 500px;
            border-radius: 15px;
            overflow: hidden;
          "
        >
          <div
            style="
              padding: 15px;
              border-bottom: 1px solid #eee;
              display: flex;
              justify-content: space-between;
              align-items: center;
            "
          >
            <h3 style="margin: 0">New Post</h3>
            <button
              onclick="document.getElementById('feed-post-modal').classList.add('hidden')"
              style="background: none; border: none; font-size: 20px"
            >
              &times;
            </button>
          </div>
          <form id="create-feed-post-form" style="padding: 20px">
            <div
              id="feed-image-preview"
              style="
                width: 100%;
                height: 300px;
                background: #f9f9f9;
                border-radius: 10px;
                margin-bottom: 15px;
                display: flex;
                align-items: center;
                justify-content: center;
                border: 2px dashed #ccc;
                cursor: pointer;
                position: relative;
                overflow: hidden;
              "
            >
              <span id="preview-text">Click to upload photo</span>
              <img
                id="img-to-upload"
                class="hidden"
                style="width: 100%; height: 100%; object-fit: cover"
              />
            </div>
            <input
              type="file"
              id="feed-file-input"
              accept="image/*"
              class="hidden"
            />
            <textarea
              id="feed-caption"
              placeholder="Write a caption..."
              style="
                width: 100%;
                height: 80px;
                border: 1px solid #ddd;
                border-radius: 8px;
                padding: 10px;
                font-family: inherit;
                resize: none;
              "
            ></textarea>
            <button
              type="submit"
              class="save-btn"
              style="width: 100%; margin-top: 15px"
            >
              Post to Feed
            </button>
          </form>
        </div>
      </div>

      <div id="section-friends" class="community-section hidden">
        <div
          style="
            background: white;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 25px;
          "
        >
          <h4 style="margin: 0 0 15px 0; color: var(--primary)">
            Discover the Pack
          </h4>
          <div
            class="filter-group"
            style="padding: 20px; display: flex; gap: 15px; flex-wrap: wrap"
          >
            <select
              id="filter-breed"
              style="
                padding: 10px;
                border-radius: 8px;
                flex: 1;
                border: 1px solid #ddd;
              "
            >
              <option value="">All Breeds</option>
            </select>

            <select
              id="filter-distance"
              style="
                padding: 10px;
                border-radius: 8px;
                flex: 1;
                border: 1px solid #ddd;
              "
            >
              <option value="">Any Distance</option>
              <option value="5">Within 5 miles</option>
              <option value="10">Within 10 miles</option>
              <option value="25">Within 25 miles</option>
              <option value="50">Within 50 miles</option>
            </select>

            <input
              type="text"
              id="member-search"
              placeholder="Search by name..."
              style="
                padding: 10px;
                border-radius: 8px;
                flex: 2;
                border: 1px solid #ddd;
              "
            />

            <button
              id="friends-search-btn"
              class="follow-btn-small"
              style="height: 40px"
            >
              Search
            </button>
          </div>
        </div>

        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
          "
        >
          <h3 style="margin: 0">
            <i class="fa fa-heart" style="color: #ff4d4d"></i> My Pack
          </h3>
          <button
            id="toggle-pack-btn"
            class="btn-outline"
            style="padding: 5px 15px; font-size: 12px"
          >
            Hide Pack
          </button>
        </div>

        <div
          id="following-grid"
          class="friends-grid-container"
          style="margin-bottom: 30px"
        ></div>
        <hr />
        <h3 style="margin-bottom: 15px">
          <i class="fa fa-plus-circle" style="color: var(--teal)"></i> New
          Friends
        </h3>
        <div id="friends-grid" class="friends-grid-container"></div>
      </div>

      <div id="section-forum" class="community-section hidden">
        <div
          style="
            background: white;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 25px;
          "
        >
          <div
            class="filter-group"
            style="display: flex; gap: 10px; align-items: center"
          >
            <input
              type="text"
              id="forum-search"
              placeholder="Search topics or content..."
              style="
                padding: 10px;
                border-radius: 8px;
                flex: 1;
                border: 1px solid #ddd;
              "
            />
            <button id="forum-search-btn" class="follow-btn-small">
              Search Forum
            </button>
            <button
              id="open-post-form"
              class="follow-btn-small"
              style="background: var(--teal)"
            >
              + New Topic
            </button>
          </div>
        </div>

        <div
          id="new-post-modal"
          class="hidden"
          style="
            background: #fff;
            padding: 20px;
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 25px;
          "
        >
          <form id="create-post-form">
            <input
              type="text"
              id="post-title"
              placeholder="Topic Title"
              required
              style="width: 100%; padding: 10px; margin-bottom: 10px"
            />
            <select
              id="post-category"
              style="width: 100%; padding: 10px; margin-bottom: 10px"
            >
              <option value="General">General</option>
              <option value="Walks">Walks</option>
            </select>
            <textarea
              id="post-description"
              placeholder="What's on your mind?"
              required
              style="
                width: 100%;
                padding: 10px;
                height: 100px;
                margin-bottom: 10px;
              "
            ></textarea>
            <button type="submit" class="save-btn">Post to Forum</button>
            <button
              type="button"
              id="cancel-post"
              style="
                background: none;
                border: none;
                width: 100%;
                margin-top: 10px;
                cursor: pointer;
              "
            >
              Cancel
            </button>
          </form>
        </div>
        <div id="dynamic-forum-list"></div>
      </div>
    </main>

    <script>
      function showSection(section) {
        // Persist tab choice in local storage
        localStorage.setItem("activeCommunityTab", section);

        document
          .querySelectorAll(".community-section")
          .forEach((s) => s.classList.add("hidden"));
        document
          .querySelectorAll(".tab-btn")
          .forEach((b) => b.classList.remove("active"));
        document
          .getElementById("section-" + section)
          .classList.remove("hidden");
        document
          .getElementById("tab-" + section + "-btn")
          .classList.add("active");
      }

      document.addEventListener("DOMContentLoaded", () => {
        // Load persisted tab
        const activeTab = localStorage.getItem("activeCommunityTab") || "posts";
        showSection(activeTab);

        const openPostBtn = document.getElementById("open-post-form");
        const postModal = document.getElementById("new-post-modal");
        const cancelPostBtn = document.getElementById("cancel-post");

        if (openPostBtn)
          openPostBtn.onclick = () => postModal.classList.remove("hidden");
        if (cancelPostBtn)
          cancelPostBtn.onclick = () => postModal.classList.add("hidden");
      });
    </script>
    <script type="module" src="firebase-config.js"></script>
  </body>
</html>
