<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>My Profile – TheDogAtlas</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <header>
      <div class="brand">
        <a href="index.html">
          <img src="Media/Logo2.jpg" alt="Logo" style="height: 55px" />
        </a>
      </div>
      <nav>
        <a href="index.html" class="nav-link">Map</a>
        <a href="planner.html" class="nav-link">Planner</a>
        <a href="trails.html" class="nav-link">Trails</a>
        <a href="events.html" class="nav-link">Events</a>
        <a href="community.html" class="nav-link">Community</a>
        <a href="profile.html" id="profile-link" class="nav-link active"
          >My Profile</a
        >
        <a href="login.html" id="login-link" class="nav-link">Login</a>
        <a
          href="#"
          id="logout-link"
          onclick="logoutUser()"
          class="nav-link hidden"
          >Log Out</a
        >
      </nav>
    </header>

    <main class="community-container">
      <div
        style="
          background: white;
          padding: 40px;
          border-radius: 16px;
          border: 1px solid var(--border);
          margin-bottom: 30px;
          text-align: center;
        "
      >
        <div
          style="
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 15px;
          "
        >
          <img
            src="https://via.placeholder.com/150"
            id="display-avatar"
            style="
              width: 100%;
              height: 100%;
              border-radius: 50%;
              object-fit: cover;
              background: #eee;
              border: 3px solid var(--primary);
            "
          />
          <label
            for="avatar-input"
            style="
              position: absolute;
              bottom: 0;
              right: 0;
              background: var(--primary);
              color: white;
              width: 35px;
              height: 35px;
              border-radius: 50%;
              display: flex;
              align-items: center;
              justify-content: center;
              cursor: pointer;
              border: 3px solid white;
            "
          >
            <i class="fa fa-camera"></i>
          </label>
          <input type="file" id="avatar-input" hidden accept="image/*" />
        </div>

        <h2 id="profile-name" style="margin-bottom: 5px">Loading...</h2>
        <p
          id="profile-email"
          style="color: var(--muted); margin-bottom: 20px"
        ></p>

        <form
          id="profile-edit-form"
          style="max-width: 500px; margin: 0 auto; text-align: left"
        >
          <div style="margin-bottom: 15px">
            <label
              style="
                display: block;
                font-size: 13px;
                font-weight: 700;
                margin-bottom: 5px;
              "
              >ID Name</label
            >
            <input
              type="text"
              id="edit-username"
              style="
                width: 100%;
                padding: 10px;
                border: 1px solid var(--border);
                border-radius: 8px;
              "
            />
          </div>
          <div style="margin-bottom: 15px">
            <label
              style="
                display: block;
                font-size: 13px;
                font-weight: 700;
                margin-bottom: 5px;
              "
              >About You & Your Dog</label
            >
            <textarea
              id="edit-bio"
              rows="3"
              style="
                width: 100%;
                padding: 10px;
                border: 1px solid var(--border);
                border-radius: 8px;
              "
              placeholder="Tell the pack about yourselves..."
            ></textarea>
          </div>
          <div style="display: flex; gap: 15px; margin-bottom: 15px">
            <div style="flex: 1">
              <label
                style="
                  display: block;
                  font-size: 13px;
                  font-weight: 700;
                  margin-bottom: 5px;
                "
                >Dog's Name</label
              >
              <input
                type="text"
                id="edit-dog-name"
                style="
                  width: 100%;
                  padding: 10px;
                  border: 1px solid var(--border);
                  border-radius: 8px;
                "
              />
            </div>
            <div style="flex: 1">
              <label
                style="
                  display: block;
                  font-size: 13px;
                  font-weight: 700;
                  margin-bottom: 5px;
                "
                >Breed</label
              >
              <input
                type="text"
                id="edit-dog-breed"
                style="
                  width: 100%;
                  padding: 10px;
                  border: 1px solid var(--border);
                  border-radius: 8px;
                "
              />
            </div>
          </div>
          <button
            type="submit"
            style="
              background: var(--teal);
              color: white;
              border: none;
              padding: 12px 25px;
              border-radius: 25px;
              font-weight: 700;
              cursor: pointer;
              width: 100%;
            "
          >
            Save Changes
          </button>
        </form>
      </div>

      <h3>My Forum Topics</h3>
      <div id="my-posts-list" class="forum-list">
        <p style="color: var(--muted)">Searching for your posts...</p>
      </div>
    </main>

    <script type="module" src="firebase-config.js"></script>

    <footer>
      <div class="footer-links">
        <a href="Footer/privacy.html">Privacy Policy</a>
        <a href="Footer/terms.html">Terms of Service</a>
        <a href="Footer/cookies.html">Cookie Policy</a>
        <a href="Footer/contact.html">Contact</a>
        <a href="Footer/about.html">About Us</a>
      </div>
      <div class="copyright">
        &copy; 2025 TheDogAtlas. The dog-first travel platform.
        <br />Always check with venues directly for current dog policies.
      </div>
    </footer>
  </body>
</html>
