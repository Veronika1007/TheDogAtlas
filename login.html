<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Login – TheDogAtlas</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <a
          href="index.html"
          style="
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
          "
        >
          <img
            src="Media/Logo2.jpg"
            alt="TheDogAtlas Logo"
            style="height: 55px; width: auto"
          />
        </a>
      </div>
      <nav>
        <a href="index.html" class="nav-link">Map</a>
        <a href="planner.html" class="nav-link">Planner</a>
        <a href="trails.html" class="nav-link">Trails</a>
        <a href="events.html" class="nav-link">Events</a>
        <a href="community.html" class="nav-link">Community</a>
      </nav>
    </header>

    <main
      class="community-container"
      style="max-width: 450px; margin: 80px auto; padding: 0 20px"
    >
      <div
        id="auth-container"
        style="
          background: white;
          padding: 40px;
          border-radius: 12px;
          border: 1px solid #ddd;
          display: flex;
          flex-direction: column;
          align-items: center;
        "
      >
        <h2 id="auth-title" style="margin-bottom: 25px; color: var(--primary)">
          Welcome Back
        </h2>

        <form
          id="auth-form"
          style="
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
          "
        >
          <input
            type="email"
            id="auth-email"
            placeholder="Email"
            required
            style="
              width: 100%;
              padding: 12px;
              margin-bottom: 15px;
              border-radius: 8px;
              border: 1px solid #ccc;
            "
          />

          <input
            type="text"
            id="auth-username"
            placeholder="Display Name / Username"
            style="
              display: none;
              width: 100%;
              padding: 12px;
              margin-bottom: 15px;
              border-radius: 8px;
              border: 1px solid #ccc;
            "
          />

          <input
            type="password"
            id="auth-password"
            placeholder="Password"
            required
            style="
              width: 100%;
              padding: 12px;
              margin-bottom: 25px;
              border-radius: 8px;
              border: 1px solid #ccc;
            "
          />

          <button
            type="submit"
            id="auth-submit"
            class="search-submit-inline"
            style="width: 200px; padding: 12px; font-weight: bold"
          >
            Login
          </button>
        </form>

        <p style="margin-top: 25px; text-align: center; font-size: 0.95rem">
          <span id="auth-toggle-text" style="color: #666"
            >Don't have an account?</span
          >
          <a
            href="#"
            id="auth-toggle-btn"
            style="
              color: #ff6b35;
              font-weight: bold;
              text-decoration: none;
              margin-left: 5px;
            "
            >Sign Up</a
          >
        </p>
      </div>
    </main>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        let isLoginMode = true;
        const authToggleBtn = document.getElementById("auth-toggle-btn");
        const authSubmitBtn = document.getElementById("auth-submit");
        const authTitle = document.getElementById("auth-title");
        const usernameInput = document.getElementById("auth-username");
        const toggleText = document.getElementById("auth-toggle-text");

        if (authToggleBtn) {
          authToggleBtn.onclick = (e) => {
            e.preventDefault();
            isLoginMode = !isLoginMode;

            authTitle.innerText = isLoginMode
              ? "Welcome Back"
              : "Join the Pack";
            authSubmitBtn.innerText = isLoginMode ? "Login" : "Sign Up";
            toggleText.innerText = isLoginMode
              ? "Don't have an account?"
              : "Already have an account?";
            authToggleBtn.innerText = isLoginMode ? "Sign Up" : "Login";

            if (usernameInput) {
              usernameInput.style.display = isLoginMode ? "none" : "block";
              usernameInput.required = !isLoginMode;
            }
          };
        }
      });
    </script>
    <script type="module" src="firebase-config.js"></script>

    <footer style="margin-top: 50px">
      <div class="footer-links">
        <a href="Footer/privacy.html">Privacy Policy</a>
        <a href="Footer/terms.html">Terms of Service</a>
        <a href="Footer/cookies.html">Cookie Policy</a>
        <a href="Footer/contact.html">Contact</a>
        <a href="Footer/about.html">About Us</a>
      </div>
      <div class="copyright">
        &copy; 2025 TheDogAtlas. The dog-first travel platform.
      </div>
    </footer>
  </body>
</html>
